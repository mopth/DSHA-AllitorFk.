<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扩展中心</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--fg:#1d2129;--mut:#6b7280;--acc:#4d6bfe;--warn:#c2410c;--ok:#15803d;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1f2023;--fg:#e8e9eb;--mut:#9ca3af;--line:#2d2f33}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:var(--bg);color:var(--fg);padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;color:var(--mut);margin:22px 4px 8px;font-weight:600}
.sub{color:var(--mut);font-size:13px;margin:0 0 6px}.banner{padding:10px 12px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:13px;margin:10px 0;display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.card .main{flex:1;min-width:0}.name{font-weight:600}.meta{color:var(--mut);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;border:1px solid var(--line);margin:4px 4px 0 0;color:var(--mut)}
.tag.on{color:var(--ok);border-color:var(--ok)}.tag.agpl{color:var(--warn);border-color:var(--warn)}
button{font:inherit;border:0;border-radius:9px;padding:7px 12px;background:var(--acc);color:#fff;min-width:64px}button.sec{background:transparent;color:var(--warn);border:1px solid var(--warn)}
button:disabled{opacity:.45}.right{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
pre{white-space:pre-wrap;word-break:break-all;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:220px;overflow:auto}
label.import{font-size:12px;color:var(--acc)}input[type=file]{display:none}
</style></head><body>
<h1>扩展中心</h1>
<p class="sub">全部离线：扩展包随 Full 版内置或从文件导入，安装前按内置目录逐一核对 sha256，并绑定当前 Ubuntu 基底版本。</p>
<div class="banner" id="banner"></div>
<div id="list"></div>
<h2>任务日志</h2><pre id="log">（空闲）</pre>
<p class="sub">许可：各包内 Ubuntu 组件按其 copyright 文件授权，源码获取方式见 /opt/dsha-ext/licenses/&lt;包&gt;/SOURCES.json；ghostscript 为 AGPL-3.0；不含 unrar 等非自由组件。</p>
<script>
'use strict';
const CATS=[['lang','语言与编译链'],['media','媒体与文档'],['devtools','开发工具']];
const $=s=>document.querySelector(s);
const mb=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':Math.max(1,Math.round(b/1048576))+' MB';
const zh=o=>o&&(o.zh||o.en)||'';
let state=null;
async function api(path,opt){const r=await fetch('/__dsha/extensions/api/'+path,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{}));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
function post(path,body){return api(path,{method:'POST',headers:{'content-type':'application/json','x-dsha-ext':'1'},body:JSON.stringify(body)})}
const MSG={EXT_BASE_TOOLS_MISMATCH:'基底工具集版本与扩展包不匹配，已拒绝安装',EXT_BASE_ROOTFS_MISMATCH:'Ubuntu 基底版本与扩展包不匹配，已拒绝安装',EXT_PACK_DIGEST:'扩展包校验失败（sha256 不符）',EXT_PACK_MISSING:'扩展包文件不存在，请先导入',EXT_BUSY:'已有任务在执行',EXT_NO_SPACE:'存储空间不足'};
const msg=e=>{const k=String(e).split(':')[0];return (MSG[k]||'')+(MSG[k]?'（'+e+'）':e)};
function render(){
  const s=state,list=$('#list');list.textContent='';
  const banner=$('#banner');banner.style.display=s.baseOk?'none':'block';banner.textContent=s.baseOk?'':msg(s.baseError);
  const busy=s.job&&s.job.running;
  for(const [cat,title] of CATS){
    const packs=s.packs.filter(p=>p.category===cat);if(!packs.length)continue;
    const h=document.createElement('h2');h.textContent=title;list.append(h);
    for(const p of packs){
      const c=document.createElement('div');c.className='card';
      const m=document.createElement('div');m.className='main';
      const n=document.createElement('div');n.className='name';n.textContent=zh(p.name)+'  '+(p.version||'');
      const d=document.createElement('div');d.className='meta';d.textContent=zh(p.summary);
      const z=document.createElement('div');z.className='meta';z.textContent='包 '+mb(p.bytes)+' · 安装后约 '+mb(p.installedBytes)+(p.requires.length?' · 依赖 '+p.requires.join('、'):'');
      m.append(n,d,z);
      const tags=[[p.active?'已启用':(p.available?'可启用':'未导入'),p.active?'on':''],...(p.agpl?[['AGPL-3.0','agpl']]:[]),...p.licenses.map(l=>[l,''])];
      for(const [t,cls] of tags){const e=document.createElement('span');e.className='tag '+cls;e.textContent=t;m.append(e)}
      const r=document.createElement('div');r.className='right';
      if(p.active){const b=document.createElement('button');b.className='sec';b.textContent='移除';b.disabled=busy;b.onclick=()=>act('remove',p);r.append(b)}
      else if(p.available){const b=document.createElement('button');b.textContent='启用';b.disabled=busy||!s.baseOk;b.onclick=()=>act('activate',p);r.append(b)}
      if(!p.active){const l=document.createElement('label');l.className='import';l.textContent=p.available?'重新导入':'从文件导入';const i=document.createElement('input');i.type='file';i.accept='.dshx,application/octet-stream';i.onchange=()=>importFile(p,i.files[0]);l.append(i);r.append(l)}
      c.append(m,r);list.append(c);
    }
  }
  const lines=(s.log||[]).join('\n');
  $('#log').textContent=(busy?'进行中：'+s.job.action+' '+s.job.pid+'\n':(s.job?(s.job.ok?'完成：':'失败：'+msg(s.job.error)+'\n')+'':''))+(lines||'（空闲）');
}
async function act(action,p){
  if(action==='remove'&&!confirm('移除「'+zh(p.name)+'」？其安装的软件包会被清理（与其它扩展共用的保留）。'))return;
  if(action==='activate'&&p.agpl&&!confirm('该扩展包含 AGPL-3.0 组件（ghostscript），继续启用？'))return;
  try{await post(action,{id:p.id})}catch(e){alert(msg(e.message))}refresh();
}
async function importFile(p,f){
  if(!f)return;$('#log').textContent='正在导入 '+f.name+'（'+mb(f.size)+'），导入时会校验 sha256…';
  try{await api('import?id='+encodeURIComponent(p.id),{method:'POST',headers:{'content-type':'application/octet-stream','x-dsha-ext':'1'},body:f})}catch(e){alert(msg(e.message))}refresh();
}
let timer=null;
async function refresh(){clearTimeout(timer);try{state=await api('state');render()}catch(e){$('#banner').style.display='block';$('#banner').textContent=String(e.message)}timer=setTimeout(refresh,state&&state.job&&state.job.running?1000:5000)}
refresh();
</script></body></html>
